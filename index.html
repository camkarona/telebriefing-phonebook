<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>텔레브리핑 교민 전화번호부</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
  <link rel="stylesheet" href="styles.css?v=0.3">
</head>
<body>

  <!-- 헤더 -->
  <header class="app-header sticky top-0 z-10">
    <div class="px-4 pt-3 pb-2">
      <div class="flex flex-col items-center text-center gap-1 mb-2">
        <!-- 로고 + 타이틀 -->
        <img src="logo.jpg" alt="뉴스브리핑 캄보디아" class="header-logo">
        <h1 class="header-title font-bold leading-tight">교민 전화번호부</h1>
        <p class="header-sub">by 텔레브리핑캄보디아</p>
      </div>

      <!-- 안내 문구 -->
      <div class="info-banner mb-2 px-3 py-2 rounded-xl">
        <p class="info-text">📍 교민업체 <strong>450곳</strong> 등록!</p>
        <p class="info-text">▼ 클릭으로 분류 선택 · 직접 전화 · 번호 복사 가능</p>
      </div>

      <!-- 검색창 -->
      <div class="relative">
        <input
          id="searchInput"
          type="text"
          placeholder="기관명 검색 (초성 가능: ㄷㅅㄱ)"
          class="search-input w-full px-4 py-2 pl-9 rounded-xl text-sm outline-none"
          autocomplete="off"
          autocorrect="off"
          spellcheck="false"
        >
        <svg class="absolute left-2.5 top-2.5 w-4 h-4" style="color: var(--tg-theme-hint-color)" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
        </svg>
        <button id="clearSearch" class="absolute right-2.5 top-2 hidden text-lg leading-none" style="color: var(--tg-theme-hint-color)">✕</button>
      </div>
    </div>

    <!-- 카테고리 드롭다운 -->
    <div class="px-4 pb-3">
      <div class="category-select-wrap relative">
        <select id="categorySelect" class="category-select w-full px-4 py-2 pr-8 rounded-xl text-sm font-medium appearance-none cursor-pointer outline-none">
          <!-- JS에서 생성 -->
        </select>
        <span class="pointer-events-none absolute right-3 top-1/2 -translate-y-1/2 text-sm">▼</span>
      </div>
    </div>
  </header>

  <!-- 결과 카운트 -->
  <div id="resultCount" class="px-4 py-1.5 text-xs" style="color: var(--tg-theme-hint-color)"></div>

  <!-- 메인 리스트 -->
  <main class="px-4 pb-6">

    <!-- 로딩 -->
    <div id="loading" class="flex flex-col items-center justify-center py-16 gap-3">
      <div class="spinner"></div>
      <p class="text-sm" style="color: var(--tg-theme-hint-color)">데이터 불러오는 중...</p>
    </div>

    <!-- 연락처 목록 -->
    <div id="contactList" class="space-y-2 hidden"></div>

    <!-- 검색 결과 없음 -->
    <div id="emptyState" class="hidden text-center py-16">
      <p class="text-4xl mb-3">🔍</p>
      <p class="font-medium" style="color: var(--tg-theme-text-color)">검색 결과가 없습니다</p>
      <p class="text-sm mt-1" style="color: var(--tg-theme-hint-color)">다른 검색어를 입력해보세요</p>
    </div>

    <!-- 오류 -->
    <div id="errorState" class="hidden text-center py-16">
      <p class="text-4xl mb-3">⚠️</p>
      <p class="font-medium" style="color: var(--tg-theme-text-color)">데이터를 불러올 수 없습니다</p>
      <p class="text-sm mt-1" style="color: var(--tg-theme-hint-color)">인터넷 연결을 확인하고<br>잠시 후 다시 시도해주세요</p>
      <button onclick="loadData()" class="mt-4 px-5 py-2 rounded-xl text-sm font-medium retry-btn">
        다시 시도
      </button>
    </div>

  </main>

  <!-- 푸터 -->
  <footer class="app-footer text-center py-4 mt-2">
    <p class="footer-version">ver 0.3</p>
    <p class="footer-dev">Developed by Karona</p>
  </footer>

  <!-- 바텀시트 -->
  <div id="bottomSheetOverlay" class="bs-overlay" onclick="closeBottomSheet()"></div>
  <div id="bottomSheet" class="bottom-sheet">
    <div class="bs-handle"></div>
    <div class="bs-info">
      <p id="bsName" class="bs-name"></p>
      <p id="bsPhone" class="bs-phone"></p>
    </div>
    <div class="bs-actions">
      <button id="bsCallBtn" class="bs-btn bs-call" onclick="bottomSheetCall()">
        <span class="bs-icon">📞</span>
        <span>전화 걸기</span>
      </button>
      <button id="bsCopyBtn" class="bs-btn bs-copy" onclick="bottomSheetCopy()">
        <span class="bs-icon">📋</span>
        <span>번호 복사</span>
      </button>
    </div>
    <button class="bs-cancel" onclick="closeBottomSheet()">취소</button>
  </div>

  <script src="app.js?v=0.3"></script>
</body>
</html>
